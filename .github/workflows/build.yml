name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            configure-args: -A x64
          - name: Linux x64
            os: ubuntu-latest
            configure-args: ""
          - name: macOS arm64
            os: macos-latest
            configure-args: ""

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # the project needs CMake 4.0 or newer
      - uses: lukka/get-cmake@latest

      - name: Install Linux dependencies (SDL2 video and audio backends)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxfixes-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols libegl1-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure-args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload game
        uses: actions/upload-artifact@v4
        with:
          name: ZumaHD-${{ runner.os }}
          path: build/bin
          if-no-files-found: error
